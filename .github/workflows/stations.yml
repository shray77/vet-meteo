name: stations

# Опрос метеостанций Ростовской области:
# METAR (NOAA) + Open-Meteo (current/hourly/daily + shortwave) → THI и THIadj (Mader 2006)
# → data/latest.json + data/snapshots/ГГГГ-ММ-ДД.json + Telegram-алерты по фронту.
# Время в сводках и коммитах — МСК (Europe/Moscow, UTC+3).
on:
  schedule:
    # GitHub сам пропускает часовые кроны (наблюдали дыры 2.5–6 ч), поэтому
    # просим трижды в час: даже с пропусками остаётся ~1–2 живых среза в час.
    # Минуты 7/27/47 — вне пиков :00/:30.
    - cron: '7,27,47 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: stations
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Опрос станций (METAR + Open-Meteo + THIadj)
        run: node tools/fetch_stations.mjs

      - name: Telegram-алерты (THI≥80 / THIadj≥80 / BRD≥75)
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: node tools/alerts.mjs

      - name: Сводка (МСК)
        run: |
          echo '### Срез станций · время МСК' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          node -e "const l=require('./data/latest.json');const msk=d=>new Date(d).toLocaleString('ru-RU',{timeZone:'Europe/Moscow',hour12:false});console.log('срез:',msk(l.generatedAt),'МСК ·',l.stations.length+' станций');for(const s of l.stations)console.log(s.name.padEnd(20),'T='+s.t,'THI='+s.thi,'adj='+(s.thiAdj!=null?s.thiAdj:'—'),'THImax7='+s.thiMax7,'BRD='+s.brd)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Коммит среза
        run: |
          git config user.name "vet-meteo-bot"
          git config user.email "actions@github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "нет изменений — не коммитим"
          else
            git commit -m "data: срез станций $(TZ='Europe/Moscow' date '+%d.%m %H:%M') МСК [skip ci]"
            ok=0
            for i in 1 2 3 4 5; do
              # --autostash: гонки двух воркфлоу больше не роняют шаг (было: cannot pull with rebase)
              if git pull --rebase --autostash origin main && git push; then ok=1; break; fi
              echo "попытка пуша $i не прошла, ждём $((i*15)) с"
              sleep $((i*15))
            done
            [ "$ok" = 1 ] || { echo "пуш не прошёл за 5 попыток"; exit 1; }
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
