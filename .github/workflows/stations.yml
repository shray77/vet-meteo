name: stations

# Опрос метеостанций Ростовской области:
# METAR (NOAA) + Open-Meteo (current/hourly/daily + shortwave) → THI и THIadj (Mader 2006)
# → data/latest.json + data/forecast.json (часовой прогноз 48 ч, из тех же ответов — без доп. запросов)
# + data/snapshots/ГГГГ-ММ-ДД.json + data/verify.json (ретро-проверка прогноза)
# + Telegram-алерты по фронту.
# Время в сводках и коммитах — МСК (Europe/Moscow, UTC+3).
on:
  schedule:
    # GitHub сам пропускает часовые кроны (наблюдали дыры 2.5–6 ч), поэтому
    # просим трижды в час: даже с пропусками остаётся ~1–2 живых среза в час.
    # Минуты 7/27/47 — вне пиков :00/:30.
    - cron: '7,27,47 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: stations
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # full-история нужна слою Б ретро-проверки (git-лог выпусков forecast.json);
      # репо растёт ~5 МБ/сут — если чекаут затянется, ограничим глубину дней 30.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Опрос станций (METAR + Open-Meteo + THIadj)
        run: node tools/fetch_stations.mjs

      - name: Ретро-проверка прогноза (verify.json)
        # слой А — бэктест модели 30 дней vs ERA5 (пересчёт раз в 12 ч, иначе кэш);
        # слой Б — наши выпуски 48 ч по git-истории против фактических срезов.
        run: node tools/verify.mjs

      - name: Telegram-алерты (THI≥80 / THIadj≥80 / BRD≥75)
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: node tools/alerts.mjs

      - name: Сводка (МСК)
        run: |
          echo '### Срез станций · время МСК' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          node -e "const l=require('./data/latest.json');const msk=d=>new Date(d).toLocaleString('ru-RU',{timeZone:'Europe/Moscow',hour12:false});console.log('срез:',msk(l.generatedAt),'МСК ·',l.stations.length+' станций');for(const s of l.stations)console.log(s.name.padEnd(20),'T='+s.t,'THI='+s.thi,'adj='+(s.thiAdj!=null?s.thiAdj:'—'),'THImax7='+s.thiMax7,'BRD='+s.brd);const fs=require('fs');if(fs.existsSync('./data/forecast.json')){const f=require('./data/forecast.json');console.log('прогноз 48ч:',msk(f.generatedAt),'МСК · от '+f.h0+' МСК · '+f.stations.length+' станций · часов: '+f.hours)}else{console.log('прогноз 48ч: НЕ собран')}if(fs.existsSync('./data/verify.json')){const v=require('./data/verify.json');console.log('ретро-проверка: расхождения '+v.verdict+(v.thi!=null?' (MAE THI ≤ '+v.thi+')':''));if(v.model&&v.model.hours)console.log('  слой А:',v.model.stations+' ст × '+v.model.hours+' ч · MAE THI '+v.model.mae.thi+(v.model.win72&&v.model.win72.pod!=null?' · окна>72: POD '+v.model.win72.pod+'% · FAR '+v.model.win72.far+'%':''));if(v.radar)console.log('  слой Б: выпусков '+v.radar.issues+' · проверено '+v.radar.hours+' ст-ч')}else{console.log('ретро-проверка: verify.json НЕ собран')}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Коммит среза
        run: |
          git config user.name "vet-meteo-bot"
          git config user.email "actions@github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "нет изменений — не коммитим"
          else
            git commit -m "data: срез станций $(TZ='Europe/Moscow' date '+%d.%m %H:%M') МСК [skip ci]"
            ok=0
            for i in 1 2 3 4 5; do
              # --autostash: гонки двух воркфлоу больше не роняют шаг (было: cannot pull with rebase)
              if git pull --rebase --autostash origin main && git push; then ok=1; break; fi
              echo "попытка пуша $i не прошла, ждём $((i*15)) с"
              sleep $((i*15))
            done
            [ "$ok" = 1 ] || { echo "пуш не прошёл за 5 попыток"; exit 1; }
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
